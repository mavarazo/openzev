<div class="d-flex align-items-center justify-content-between pb-3">
  <ng-container>
    <h4>Meter Points</h4>
  </ng-container>
  <div class="btn-toolbar d-flex justify-content-end" role="toolbar">
    <div class="btn-group" role="group">
      <button class="btn btn-outline-primary" routerLink="add">
        <i class="bi bi-plus-lg me-1"></i>
        <span>Add</span>
      </button>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <table class="table table-striped table-hover">
      <caption>
        List of meter points
      </caption>
      <thead>
        <tr>
          <th scope="col">Number</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          @for (meterPoint of meterPoints(); track meterPoint.id) {
            <td>{{ meterPoint.number }}</td>
          }
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div
    id="errorToast"
    class="toast"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
  >
    <div class="toast-header">
      <strong class="me-auto">{{ errorMessage }}</strong>
      <small>11 mins ago</small>
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="toast"
        aria-label="Close"
      ></button>
    </div>
    <div class="toast-body"></div>
  </div>
</div>
