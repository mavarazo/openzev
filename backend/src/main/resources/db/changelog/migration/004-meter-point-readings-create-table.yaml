databaseChangeLog:
  - changeSet:
      id: 8b39b91b-23b0-44ec-bde8-be0b8c75d839
      author: mav
      changes:
        - createTable:
            tableName: meter_point_readings
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: reading_id
                  type: varchar(36)
                  constraints:
                    nullable: false
              - column:
                  name: meter_point_id
                  type: varchar(36)
                  constraints:
                    nullable: false
              - column:
                  name: peak_tariff
                  type: number
                  constraints:
                    nullable: false
              - column:
                  name: off_peak_tariff
                  type: number
                  constraints:
                    nullable: false
              - column:
                  name: total
                  type: number
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: meter_point_readings
            baseColumnNames: reading_id
            referencedTableName: readings
            referencedColumnNames: id
            constraintName: fk_meter_point_readings_reading_id
        - addForeignKeyConstraint:
            baseTableName: meter_point_readings
            baseColumnNames: meter_point_id
            referencedTableName: meter_points
            referencedColumnNames: id
            constraintName: fk_meter_point_readings_meter_point_id
