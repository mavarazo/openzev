databaseChangeLog:
  - changeSet:
      id: 4fcc1df3-aaf5-4bec-8886-7a7248e7fd71
      author: mav
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: readings
      changes:
        - createTable:
            tableName: readings
            columns:
              - column:
                  name: oid
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: meter_point_id
                  type: varchar(36)
                  constraints:
                    nullable: false
              - column:
                  name: peak_tariff
                  type: number
                  constraints:
                    nullable: false
              - column:
                  name: off_peak_tariff
                  type: number
                  constraints:
                    nullable: false
              - column:
                  name: total
                  type: number
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: readings
            baseColumnNames: meter_point_id
            referencedTableName: meter_points
            referencedColumnNames: oid
            constraintName: fk_readings_meter_point_id
        - addUniqueConstraint:
            tableName: readings
            columnNames: date, meter_point_id
