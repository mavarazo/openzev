databaseChangeLog:
  - changeSet:
      id: d1eca8a2-3c5e-44f3-b83c-83cfe8a7fa3f
      author: mav
      changes:
        - createTable:
            tableName: units
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: number
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(255)
              - column:
                  name: last_name
                  type: varchar(255)
                  constraints:
                    nullable: false
