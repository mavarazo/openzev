openapi: 3.0.4

info:
  version: 1.0.0
  title: OpenZEV API

paths:
  /v1/meter-points:
    get:
      operationId: getMeterPoints
      tags:
        - Meter Point
      responses:
        200:
          description: All meter points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeterPoint'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      operationId: createMeterPoint
      tags:
        - Meter Point
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeterPoint'
      responses:
        201:
          description: Created meter point
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterPoint'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/meter-points/{meterPointId}:
    parameters:
      - $ref: '#/components/parameters/MeterPointIdParameter'

    get:
      operationId: getMeterPoint
      tags:
        - Meter Point
      responses:
        200:
          description: Detail meter point
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterPoint'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      operationId: changeMeterPoint
      tags:
        - Meter Point
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeterPoint'
      responses:
        200:
          description: Changed meter point
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterPoint'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      operationId: deleteMeterPoint
      tags:
        - Meter Point
      responses:
        204:
          description: Deleted meter point
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/meter-point-readings:
    get:
      operationId: getMeterPointReadings
      tags:
        - Meter Point Reading
      parameters:
        - name: readingId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: All meter point readings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeterPointReading'

    post:
      operationId: createMeterPointReading
      tags:
        - Meter Point Reading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeterPointReading'
      responses:
        201:
          description: Created reading
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterPointReading'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/meter-point-readings/{meterPointReadingId}:
    parameters:
      - $ref: '#/components/parameters/MeterPointReadingIdParameter'

    get:
      operationId: getMeterPointReading
      tags:
        - Meter Point Reading
      responses:
        200:
          description: Detail meter point reading
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterPointReading'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      operationId: changeMeterPointReading
      tags:
        - Meter Point Reading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeterPointReading'
      responses:
        200:
          description: Changed  meter point reading
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterPointReading'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      operationId: deleteMeterPointReading
      tags:
        - Meter Point Reading
      responses:
        204:
          description: Deleted meter point reading
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/readings:
    get:
      operationId: getReadings
      tags:
        - Reading
      responses:
        200:
          description: All readings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reading'

    post:
      operationId: createReading
      tags:
        - Reading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reading'
      responses:
        201:
          description: Created reading
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reading'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/readings/{readingId}:
    parameters:
      - $ref: '#/components/parameters/ReadingIdParameter'

    get:
      operationId: getReading
      tags:
        - Reading
      responses:
        200:
          description: Detail reading
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reading'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      operationId: changeReading
      tags:
        - Reading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reading'
      responses:
        200:
          description: Changed reading
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reading'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      operationId: deleteReading
      tags:
        - Reading
      responses:
        204:
          description: Deleted reading
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/units:
    get:
      operationId: getUnits
      tags:
        - Unit
      responses:
        200:
          description: All units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Unit'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      operationId: createUnit
      tags:
        - Unit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Unit'
      responses:
        201:
          description: Created unit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/units/{unitId}:
    parameters:
      - $ref: '#/components/parameters/UnitIdParameter'

    get:
      operationId: getUnit
      tags:
        - Unit
      responses:
        200:
          description: Detail unit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      operationId: changeUnit
      tags:
        - Unit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Unit'
      responses:
        200:
          description: Changed unit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      operationId: deleteUnit
      tags:
        - Unit
      responses:
        204:
          description: Deleted unit
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  parameters:
    MeterPointIdParameter:
      name: meterPointId
      in: path
      schema:
        type: string
        format: uuid
      required: true

    MeterPointReadingIdParameter:
      name: meterPointReadingId
      in: path
      schema:
        type: string
        format: uuid
      required: true

    ReadingIdParameter:
      name: readingId
      in: path
      schema:
        type: string
        format: uuid
      required: true

    UnitIdParameter:
      name: unitId
      in: path
      schema:
        type: string
        format: uuid
      required: true

  schemas:
    Id:
      type: string
      format: uuid

    Date:
      type: string
      format: date

    DateTime:
      type: string
      format: date-time

    Error:
      type: object
      properties:
        code:
          type: string
        args:
          type: array
          items:
            type: string
        message:
          type: string
      required:
        - code
        - message

    MeterPoint:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
          readOnly: true
        unitId:
          $ref: '#/components/schemas/Id'
          writeOnly: true
        number:
          type: string
      required:
        - number

    Reading:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
          readOnly: true
        date:
          $ref: '#/components/schemas/Date'
      required:
        - date

    MeterPointReading:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
          readOnly: true
        reading:
          $ref: '#/components/schemas/Reading'
          readOnly: true
        readingId:
          $ref: '#/components/schemas/Id'
          writeOnly: true
        meterPoint:
          $ref: '#/components/schemas/MeterPoint'
          readOnly: true
        meterPointId:
          $ref: '#/components/schemas/Id'
          writeOnly: true
        peakTariff:
          type: number
        offPeakTariff:
          type: number
        total:
          type: number
      required:
        - readingId
        - meterPointId
        - peakTariff
        - offPeakTariff
        - total

    Unit:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
          readOnly: true
        number:
          type: string
        firstName:
          type: string
        lastName:
          type: string
      required:
        - number
        - lastName